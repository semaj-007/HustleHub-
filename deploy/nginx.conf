log_format audit_json escape=json '{"event":"web.request","method":"$request_method","path":"$uri","status":$status,"duration":$request_time,"requestId":"$upstream_http_x_request_id"}';
access_log /dev/stdout audit_json;
server {
  listen 8080;
  server_name localhost;
  location = /health { access_log off; default_type application/json; return 200 '{"status":"ok"}'; }
  location / { return 404; }
}
server {
  listen 8443 ssl;
  server_name localhost;
  ssl_certificate /run/secrets/tls_cert;
  ssl_certificate_key /run/secrets/tls_key;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 10k;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; object-src 'none'" always;
  location /api/ {
    proxy_pass https://api:8443;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /run/secrets/tls_cert;
    proxy_ssl_name localhost;
    proxy_ssl_server_name on;
    proxy_ssl_verify_depth 2;
    proxy_set_header Host localhost;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Request-ID "";
  }
  location = /metrics { return 404; }
  location / { try_files $uri $uri/ /index.html; }
}
